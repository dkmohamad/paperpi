# Which SANE backends this box loads.
#
# Debian's own /etc/sane.d/dll.conf enables 77 of them, and enumerating devices
# then means loading every one -- including `escl`, which does mDNS discovery on
# each call. Measured on this Pi: listing devices took 8.7 seconds with the
# default, and 0.03 seconds with this file. It also returned four devices
# instead of one, because the printer's flatbed answers SANE too.
#
# Installed at /etc/paperpi/sane/dll.conf and selected with
# SANE_CONFIG_DIR=/etc/paperpi/sane: -- the trailing colon matters. It appends
# the default path, so the backend's own fujitsu.conf (which carries the USB
# ids and the tuned buffer size) is still found. Without the colon nothing is
# found at all.
fujitsu
